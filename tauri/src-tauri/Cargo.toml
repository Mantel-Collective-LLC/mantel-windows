[package]
name = "mantel-desktop"
version = "0.0.0" # placeholder: the app version comes from ../../package.json (build.rs)
description = "Mantel VPN für Windows (Tauri-Hülle, Vorschau)"
authors = ["Mantel"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "mantel_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["net", "time", "io-util", "macros", "sync", "rt", "process"] }
getrandom = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
